<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE OS · 通元问科 FDE 交付操作系统</title>
<style>
:root{
  --ink:#1a1d21; --ink-2:#4a5058; --ink-3:#8a919b;
  --line:#e3e6ea; --line-2:#d3d7dd;
  --bg:#ffffff; --bg-2:#f7f8f9; --bg-3:#eef0f2;
  --accent:#0f4c81; --accent-weak:#e8f0f7;
  --mark:#fff3c2;
  --mono:"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px}
#app{display:flex;min-height:100vh}

/* ---------- 侧栏 ---------- */
#sidebar{width:300px;flex:0 0 300px;border-right:1px solid var(--line);background:var(--bg-2);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
#brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
#brand h1{margin:0;font-size:17px;letter-spacing:.5px}
#brand h1 b{color:var(--accent);font-weight:700}
#brand p{margin:4px 0 0;font-size:12px;color:var(--ink-3)}
#searchbox{padding:12px 14px 8px}
#search{width:100%;padding:7px 10px;font-size:13px;font-family:var(--sans);border:1px solid var(--line-2);
  border-radius:6px;background:#fff;color:var(--ink);outline:none}
#search:focus{border-color:var(--accent)}
#tree{flex:1;overflow-y:auto;padding:6px 8px 20px}
.tgroup{margin-top:10px}
.tgroup>.glabel{font-size:11.5px;color:var(--ink-3);padding:2px 10px;letter-spacing:.4px;user-select:none}
.tgroup.empty>.glabel{color:#c2c7cd}
.titem{display:block;width:100%;text-align:left;padding:5px 10px 5px 22px;border:0;background:none;
  font-size:13.5px;line-height:1.45;color:var(--ink-2);cursor:pointer;border-radius:6px;font-family:var(--sans)}
.titem:hover{background:var(--bg-3);color:var(--ink)}
.titem.on{background:var(--accent-weak);color:var(--accent);font-weight:600}
.titem .cnt{float:right;font-size:11px;color:var(--ink-3);margin-left:6px}
#sidefoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center}
#sidefoot button{font-size:12px;padding:4px 10px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);
  border-radius:6px;cursor:pointer;font-family:var(--sans)}
#sidefoot button:hover{border-color:var(--accent);color:var(--accent)}
#sidefoot .status{font-size:11.5px;color:var(--ink-3);margin-left:auto}

/* 搜索结果 */
.sres{padding:6px 10px;border-radius:6px;cursor:pointer}
.sres:hover{background:var(--bg-3)}
.sres .sf{font-size:13px;color:var(--accent);font-weight:600}
.sres .sn{font-size:12px;color:var(--ink-3);margin:2px 0}
.sres .sq{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.sres mark{background:var(--mark);padding:0 1px;border-radius:2px}

/* ---------- 主区 ---------- */
#main{flex:1;min-width:0;display:flex;justify-content:center}
#docwrap{width:100%;max-width:900px;padding:34px 48px 120px}
#docmeta{font-size:12px;color:var(--ink-3);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px 14px}
#docmeta .mpath{font-family:var(--mono);font-size:11.5px}
#docmeta span b{color:var(--ink-2);font-weight:600}

/* ---------- 正文排版（忠实呈现） ---------- */
.markdown{line-height:1.8;color:var(--ink)}
.markdown h1,.markdown h2,.markdown h3,.markdown h4{line-height:1.4;font-weight:700}
.markdown h1{font-size:24px;margin:8px 0 20px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.markdown h2{font-size:19px;margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.markdown h3{font-size:16.5px;margin:28px 0 10px}
.markdown h4{font-size:15px;margin:22px 0 8px;color:var(--ink-2)}
.markdown p{margin:12px 0}
.markdown ul,.markdown ol{margin:12px 0;padding-left:1.6em}
.markdown li{margin:5px 0}
.markdown blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--accent);
  background:var(--bg-2);color:var(--ink-2)}
.markdown blockquote p{margin:6px 0}
.markdown code{font-family:var(--mono);font-size:.86em;background:var(--bg-3);
  padding:1.5px 5px;border-radius:4px}
.markdown pre{background:#20242a;color:#e6e9ec;padding:14px 16px;border-radius:8px;overflow-x:auto;
  margin:16px 0;font-size:13px;line-height:1.6}
.markdown pre code{background:none;padding:0;color:inherit;font-size:inherit}
.markdown hr{border:0;border-top:1px solid var(--line-2);margin:32px 0}
.markdown a{color:var(--accent);text-decoration:none;border-bottom:1px solid #b8cde0}
.markdown a:hover{border-bottom-color:var(--accent)}
.markdown strong{font-weight:700}
.markdown img{max-width:100%}
.table-wrap{overflow-x:auto;margin:16px 0}
.markdown table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.6}
.markdown th{background:var(--bg-3);font-weight:600;text-align:left;white-space:nowrap;
  padding:8px 12px;border:1px solid var(--line-2)}
.markdown td{padding:7px 12px;border:1px solid var(--line);vertical-align:top}
.markdown tbody tr:nth-child(even) td{background:#fafbfc}
.hl{background:var(--mark);border-radius:3px;transition:background 2s}
.heading-anchor{opacity:0;font-size:.7em;color:var(--ink-3);text-decoration:none;border:0;
  margin-left:8px;vertical-align:middle}
.markdown h1:hover .heading-anchor,.markdown h2:hover .heading-anchor,
.markdown h3:hover .heading-anchor,.markdown h4:hover .heading-anchor{opacity:1}

/* ---------- 右侧目录 ---------- */
#toc{width:230px;flex:0 0 230px;border-left:1px solid var(--line);padding:38px 18px 60px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
#toc .tlabel{font-size:11.5px;color:var(--ink-3);letter-spacing:.4px;margin-bottom:8px}
#toc a{display:block;font-size:12.5px;color:var(--ink-2);text-decoration:none;border:0;
  padding:3px 8px;border-left:2px solid transparent;line-height:1.5}
#toc a:hover{color:var(--accent)}
#toc a.on{border-left-color:var(--accent);color:var(--accent);font-weight:600}
#toc a.lv3{padding-left:20px;font-size:12px}

#empty{max-width:640px;margin:16vh auto 0;text-align:center;color:var(--ink-3);line-height:2}
#empty .big{font-size:20px;color:var(--ink-2)}

@media (max-width:1500px){#toc{display:none}}
@media (max-width:980px){
  #sidebar{position:static;width:100%;flex:none;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  #tree{max-height:280px}
  #app{flex-direction:column}
  #docwrap{padding:24px 20px 100px}
}
@media print{
  #sidebar,#toc,#sidefoot{display:none}
  #app{display:block}#docwrap{max-width:none;padding:0}
  .markdown pre{background:#f3f3f3;color:#000}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="brand">
      <h1><b>FDE OS</b> 文档</h1>
      <p>通元问科 FDE 交付操作系统 · 只读视图</p>
    </div>
    <div id="searchbox"><input id="search" type="search" placeholder="搜索全部文档（标题+正文）…" autocomplete="off"></div>
    <nav id="tree"></nav>
    <div id="sidefoot">
      <button id="rescan" title="重新读取目录与文档">刷新</button>
      <span class="status" id="fstat"></span>
    </div>
  </aside>
  <main id="main">
    <div id="docwrap" hidden>
      <div id="docmeta"></div>
      <article id="content" class="markdown"></article>
    </div>
    <div id="empty">
      <div class="big">FDE OS v0.1</div>
      <div>左侧选择文档 · 顶部输入框全文搜索<br>内容直接读取自本目录 .md 源文件，本视图不做任何修饰</div>
    </div>
  </main>
  <aside id="toc"><div class="tlabel">本页目录</div><div id="toclist"></div></aside>
</div>

<script src="marked.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const NAV_GROUPS={'先了解':['.','07_System_Map','01_Doctrine'],'照着做':['08_Outputs'],'常见问题':[],'现场工具':['05_Field_Toolkit'],'进阶·治理':['00_Master_Index','06_Evidence_Library','09_Research_Notes','10_Decision_Log','02_Operating_Model','03_Delivery_Playbook','04_Commercial_Engine','_archive']};
const DIR_LABELS={
  '.':'根目录','00_Master_Index':'00 总控 · Master Index','01_Doctrine':'01 信条 · Doctrine',
  '02_Operating_Model':'02 组织模型 · Operating Model','03_Delivery_Playbook':'03 交付手册 · Playbook',
  '04_Commercial_Engine':'04 商业引擎 · Commercial','05_Field_Toolkit':'05 现场工具 · Toolkit',
  '06_Evidence_Library':'06 证据库 · Evidence','07_System_Map':'07 系统总图 · System Map',
  '08_Outputs':'08 输出层 · Outputs','09_Research_Notes':'09 研究笔记 · Research Notes',
  '10_Decision_Log':'10 决定日志 · Decision Log','_archive':'归档 _archive'
};
const ORDER=['.','00_Master_Index','01_Doctrine','02_Operating_Model','03_Delivery_Playbook',
  '04_Commercial_Engine','05_Field_Toolkit','06_Evidence_Library','07_System_Map','08_Outputs',
  '09_Research_Notes','10_Decision_Log','_archive'];

let FILES=[];                 // 全部文档元数据
let INDEX=new Map();          // path -> {title, text}
let currentPath=null;
let pendingScrollQuery=null;

marked.use({gfm:true,breaks:false});

function fmtSize(n){return n<1024?n+' B':(n/1024).toFixed(1)+' KB'}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmParse(raw){        // 剥离并解析 frontmatter
  const m=raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if(!m)return{fm:null,body:raw};
  const fm={};
  m[1].split(/\r?\n/).forEach(line=>{
    const kv=line.match(/^([A-Za-z_\-0-9]+)\s*:\s*(.+)$/);
    if(kv)fm[kv[1]]=kv[2].replace(/^['"]|['"]$/g,'');
  });
  return{fm,body:raw.slice(m[0].length)};
}
function fileTitle(path,raw){
  const h1=raw.match(/^#\s+(.+)$/m);
  return h1?h1[1].trim():path.split('/').pop().replace(/\.md$/,'');
}

/* ---------- 目录树 ---------- */
function renderTree(){
  const tree=$('#tree');tree.innerHTML='';
  if(SEARCHQ&&SEARCHQ.trim()){return renderSearch(SEARCHQ.trim());}
  const mkItem=f=>{
    const ti=INDEX.has(f.path)?INDEX.get(f.path).title:f.path;
    const b=document.createElement('button');b.className='titem';b.dataset.path=f.path;
    b.innerHTML='<span class="cnt">'+fmtSize(f.size)+'</span>'+esc(ti);
    b.onclick=()=>openDoc(f.path);return b;
  };
  const mkGroup=(label,files)=>{
    if(!files.length)return;
    const g=document.createElement('div');g.className='tgroup';
    g.innerHTML='<div class="glabel">'+esc(label)+(files.length?'':'（未建）')+'</div>';
    files.forEach(f=>g.appendChild(mkItem(f)));tree.appendChild(g);
  };
  const filesOf=dirs=>FILES.filter(f=>{const d=f.path.includes('/')?f.path.split('/')[0]:'.';return dirs.includes(d);});
  const def=FILES.find(f=>f.path==='08_Outputs/FAQ_v0.1.md');
  const faq=document.createElement('button');faq.className='titem';
  faq.innerHTML='<span class="cnt">FAQ</span>常见问题（10 问）';faq.onclick=()=>def&&openDoc(def.path);
  const used=new Set();
  Object.entries(NAV_GROUPS).forEach(([label,dirs])=>{
    if(label==='常见问题'){const g=document.createElement('div');g.className='tgroup';g.innerHTML='<div class="glabel">常见问题</div>';g.appendChild(faq);tree.appendChild(g);return;}
    const fs=filesOf(dirs);fs.forEach(f=>used.add(f.path));mkGroup(label,fs);
  });
  const rest=FILES.filter(f=>!used.has(f.path));
  mkGroup('进阶·治理·其他',rest);
  $('#fstat').textContent=FILES.length+' 篇';
}

/* ---------- 打开文档 ---------- */
async function openDoc(path,scrollTo){
  try{
    const r=await fetch('/api/content?path='+encodeURIComponent(path));
    if(!r.ok)throw 0;
    const j=await r.json();
    currentPath=path;
    const {fm,body}=fmParse(j.content);
    $('#empty').hidden=true;$('#docwrap').hidden=false;
    document.title=fileTitle(path,j.content)+' · FDE OS';

    const meta=[];
    if(fm)for(const k of['version','status','updated','type'])if(fm[k])meta.push(`<span><b>${esc(k)}</b> ${esc(fm[k])}</span>`);
    meta.unshift(`<span class="mpath">${esc(path)}</span>`);
    $('#docmeta').innerHTML=meta.join('');

    $('#content').innerHTML=marked.parse(body);

    // 内部 .md 相对链接 → openDoc；目录链接 → 打开该目录下第一个文件
    $('#content').querySelectorAll('a[href]').forEach(el=>{
      const href=el.getAttribute('href');
      if(/^(https?:|#|mailto:)/.test(href)) return;
      const clean=decodeURIComponent(href.split('#')[0]);
      if(clean.endsWith('.md')){
        const base=currentPath?currentPath.replace(/[^/]+$/,''):'';
        const norm=(base+clean).split('/').reduce((acc,part)=>{
          if(part==='.'||part==='')return acc;
          if(part==='..')acc.pop();else acc.push(part);return acc;
        },[]).join('/');
        el.setAttribute('href','#'+encodeURIComponent(norm));
        el.addEventListener('click',e=>{e.preventDefault();openDoc(norm);});
      } else if(clean.endsWith('/')){
        el.addEventListener('click',e=>{e.preventDefault();
          const base=currentPath?currentPath.replace(/[^/]+$/,''):'';
          const norm=(base+clean).split('/').reduce((acc,part)=>{
            if(part==='.'||part==='')return acc;
            if(part==='..')acc.pop();else acc.push(part);return acc;
          },[]).join('/')+'/';
          const first=FILES.find(f=>f.path.startsWith(norm)&&f.path.endsWith('.md'));
          if(first)openDoc(first.path);
        });
      }
    });

    // 标题锚点 + 目录
    const toclist=[];let n=0;
    $('#content').querySelectorAll('h1,h2,h3,h4').forEach(h=>{
      h.id='h-'+(++n);
      const a=document.createElement('a');a.className='heading-anchor';a.href='#'+h.id;a.textContent='#';
      h.appendChild(a);
      if(/^H[123]$/.test(h.tagName))toclist.push(`<a href="#${h.id}" class="lv${h.tagName[1]}">${esc(h.textContent.replace(/#$/,''))}</a>`);
    });
    $('#toclist').innerHTML=toclist.join('');

    document.querySelectorAll('.titem').forEach(b=>b.classList.toggle('on',b.dataset.path===path));
    if(scrollTo==='query'&&pendingScrollQuery)scrollToQuery(pendingScrollQuery);
    else if(typeof scrollTo==='string'&&scrollTo.startsWith('#h-')){
      const el=document.getElementById(scrollTo.slice(1));if(el)el.scrollIntoView();
    }else window.scrollTo(0,0);
    history.replaceState(null,'','#'+encodeURIComponent(path));
    tocObserve();
  }catch(e){
    $('#content').innerHTML='<p style="color:#c0392b">读取失败：'+esc(path)+'</p>';
  }
}

/* ---------- TOC 高亮 ---------- */
function tocObserve(){
  const links=[...document.querySelectorAll('#toclist a')];
  if(!links.length)return;
  const io=new IntersectionObserver(es=>{
    es.forEach(en=>{
      if(en.isIntersecting){
        links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id));
      }
    });
  },{rootMargin:'-80px 0px -70% 0px'});
  const ids=links.map(a=>a.getAttribute('href').slice(1));
  ids.forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el)});
}

/* ---------- 搜索 ---------- */
function snippet(text,q){
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return null;
  const s=Math.max(0,i-32),e=Math.min(text.length,i+q.length+48);
  return( s>0?'…':'')+esc(text.slice(s,e)).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>')+(e<text.length?'…':'');
}
let SEARCHQ='';function renderSearch(q){doSearch(q);}
function doSearch(q){
  const tree=$('#tree');
  if(!q){SEARCHQ='';renderTree();return}
  tree.innerHTML='';
  const ql=q.toLowerCase();
  const hits=[];
  INDEX.forEach((v,path)=>{
    const inTitle=v.title.toLowerCase().includes(ql);
    const sn=snippet(v.text,q);
    if(inTitle||sn)hits.push({path,n:count(v.text,ql),sn,inTitle});
  });
  hits.sort((a,b)=>(b.inTitle-a.inTitle)||(b.n-a.n));
  const label=document.createElement('div');label.className='glabel';
  label.style.cssText='padding:10px 10px 4px;color:#8a919b;font-size:11.5px';
  label.textContent=`找到 ${hits.length} 篇 · "${q}"`;
  tree.appendChild(label);
  hits.slice(0,30).forEach(h=>{
    const d=document.createElement('div');d.className='sres';
    d.innerHTML=`<div class="sf">${esc(INDEX.get(h.path).title)}</div>`+
      (h.sn?`<div class="sq">${h.sn}</div>`:'')+
      `<div class="sn">${esc(h.path)}${h.n?' · '+h.n+' 处':''}</div>`;
    d.onclick=()=>{pendingScrollQuery=q;openDoc(h.path,'query')};
    tree.appendChild(d);
  });
  if(!hits.length)tree.insertAdjacentHTML('beforeend','<div style="padding:14px 10px;color:#8a919b;font-size:13px">无匹配</div>');
}
function count(text,ql){let n=0,i=0;while((i=text.toLowerCase().indexOf(ql,i))>=0){n++;i+=ql.length}return n}
function scrollToQuery(q){
  const walk=document.createTreeWalker($('#content'),NodeFilter.SHOW_TEXT);
  let node;
  while(node=walk.nextNode()){
    const i=node.textContent.toLowerCase().indexOf(q.toLowerCase());
    if(i>=0){
      const range=document.createRange();
      range.setStart(node,i);range.setEnd(node,i+q.length);
      const span=document.createElement('span');span.className='hl';
      range.surroundContents(span);
      span.scrollIntoView({block:'center'});
      setTimeout(()=>span.classList.remove('hl'),2500);
      return;
    }
  }
  window.scrollTo(0,0);
}

/* ---------- 启动 ---------- */
async function loadIndex(){
  const r=await fetch('/api/files');const j=await r.json();
  FILES=j.files;
  INDEX.clear();
  await Promise.all(FILES.map(async f=>{
    const c=await(await fetch('/api/content?path='+encodeURIComponent(f.path))).json();
    INDEX.set(f.path,{title:fileTitle(f.path,c.content),text:c.content});
  }));
  renderTree();
}
$('#rescan').onclick=async()=>{await loadIndex();if(currentPath)openDoc(currentPath)};
const sbox=$('#search');SEARCHQ='';sbox.addEventListener('input',e=>{clearTimeout(window._st);window._st=setTimeout(()=>{SEARCHQ=e.target.value;renderTree();},160)});

(async function init(){
  marked.setOptions({gfm:true});
  await loadIndex();
  const h=decodeURIComponent(location.hash.slice(1));
  const first=FILES.find(f=>f.path==='README.md')||FILES[0];
  const init=h&&INDEX.has(h)?h:(first&&first.path);
  if(init)openDoc(init);else renderTree();
})();
</script>
</body>
</html>
